<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha na Palavra — Plano de Leitura em 365 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12172B;
    --bg-panel: #1A2140;
    --bg-panel-2: #212B52;
    --bg-tile: #1E2648;
    --text: #EDE8DC;
    --text-muted: #9AA3C4;
    --text-faint: #6B7398;
    --gold: #CBA135;
    --gold-bright: #E3BE55;
    --rust: #C06A4E;
    --done: #7CA383;
    --border: rgba(154,163,196,0.16);
    --border-strong: rgba(203,161,53,0.4);
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(203,161,53,0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(180,87,63,0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', system-ui, sans-serif;
    line-height: 1.5;
    padding-bottom: 4rem;
  }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  /* ---------- Header ---------- */
  header{
    padding: 2.75rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 0.6rem;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(1.9rem, 4.5vw, 2.7rem);
    margin: 0 0 0.35rem;
    letter-spacing: -0.01em;
  }

  .subtitle{
    color: var(--text-muted);
    font-size: 0.98rem;
    margin-bottom: 1.6rem;
  }

  .progress-row{
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .progress-count{
    font-family: 'Fraunces', serif;
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--gold-bright);
    white-space: nowrap;
  }
  .progress-count span{
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 400;
  }

  .progress-track{
    flex: 1;
    min-width: 160px;
    height: 6px;
    border-radius: 999px;
    background: var(--bg-panel-2);
    overflow: hidden;
    position: relative;
  }
  .progress-fill{
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--rust), var(--gold));
    transition: width 0.4s ease;
  }

  .progress-pct{
    font-size: 0.85rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ---------- Reading panel (sticky) ---------- */
  .reading-panel{
    position: sticky;
    top: 0.85rem;
    z-index: 20;
    margin-top: 1.5rem;
    background: linear-gradient(155deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 1.15rem 1.3rem;
    box-shadow: 0 12px 30px -12px rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .reading-panel .rp-left{
    display: flex;
    align-items: baseline;
    gap: 0.85rem;
    flex-wrap: wrap;
  }

  .rp-day{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--gold-bright);
    white-space: nowrap;
  }

  .rp-date{
    font-size: 0.8rem;
    color: var(--text-faint);
    white-space: nowrap;
  }

  .rp-reading{
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
  }

  .rp-actions{
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .btn{
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 7px;
    padding: 0.5rem 0.85rem;
    border: 1px solid var(--border);
    background: var(--bg-tile);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .btn:hover{ border-color: var(--border-strong); }

  .btn-mark{
    background: transparent;
    border-color: var(--done);
    color: var(--done);
  }
  .btn-mark.is-done{
    background: var(--done);
    color: #0f1a12;
    border-color: var(--done);
  }

  /* ---------- Controls ---------- */
  .controls{
    display: flex;
    gap: 0.7rem;
    margin: 1.5rem 0 0.5rem;
    flex-wrap: wrap;
  }

  .search-box{
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box input{
    width: 100%;
    background: var(--bg-tile);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem 0.9rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.92rem;
  }
  .search-box input:focus{
    outline: none;
    border-color: var(--gold);
  }
  .search-box input::placeholder{ color: var(--text-faint); }

  .controls .btn{ padding: 0.65rem 0.95rem; }

  /* ---------- Month sections ---------- */
  .months{
    margin-top: 1.6rem;
  }

  details.month{
    border-bottom: 1px solid var(--border);
  }
  details.month[open] summary{
    color: var(--gold-bright);
  }

  summary{
    list-style: none;
    cursor: pointer;
    padding: 1rem 0.15rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
    user-select: none;
  }
  summary::-webkit-details-marker{ display:none; }

  .summary-right{
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .month-mini-track{
    width: 70px;
    height: 4px;
    border-radius: 999px;
    background: var(--bg-panel-2);
    overflow: hidden;
  }
  .month-mini-fill{
    height: 100%;
    background: var(--gold);
  }

  .chev{
    font-size: 0.8rem;
    color: var(--text-faint);
    transition: transform 0.2s;
  }
  details[open] .chev{ transform: rotate(90deg); }

  .day-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.55rem;
    padding: 0.3rem 0.15rem 1.4rem;
  }

  .day-tile{
    position: relative;
    text-align: left;
    background: var(--bg-tile);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 0.65rem 0.6rem;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
  }
  .day-tile:hover{
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .day-tile.is-today{
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(203,161,53,0.25);
  }
  .day-tile.is-active{
    border-color: var(--gold-bright);
    background: var(--bg-panel-2);
  }
  .day-tile.is-done{
    border-color: rgba(124,163,131,0.55);
  }

  .tile-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.3rem;
  }

  .tile-day{
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .day-tile.is-today .tile-day{ color: var(--gold-bright); }

  .tile-check{
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .tile-check:hover{ border-color: var(--done); }
  .day-tile.is-done .tile-check{
    background: var(--done);
    border-color: var(--done);
  }
  .tile-check svg{
    width: 10px; height: 10px;
    opacity: 0;
  }
  .day-tile.is-done .tile-check svg{ opacity: 1; }

  .tile-reading{
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.25;
  }
  .tile-date{
    font-size: 0.7rem;
    color: var(--text-faint);
    margin-top: 0.2rem;
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top: 2.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 0.8rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .no-results{
    color: var(--text-faint);
    padding: 2rem 0.5rem;
    text-align: center;
    font-size: 0.9rem;
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Plano de leitura cronológico</div>
    <h1>Trilha na Palavra</h1>
    <div class="subtitle">365 dias percorrendo as Escrituras na ordem dos acontecimentos.</div>
    <div class="progress-row">
      <div class="progress-count" id="progressCount">— <span>/ 365 lidos</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
  </header>

  <div class="reading-panel" id="readingPanel">
    <div class="rp-left">
      <span class="rp-day" id="rpDay">Dia —</span>
      <span class="rp-date" id="rpDate">—</span>
      <span class="rp-reading" id="rpReading">Selecione um dia abaixo</span>
    </div>
    <div class="rp-actions">
      <button class="btn" id="btnHoje">Ir para hoje</button>
      <button class="btn btn-mark" id="btnMark">Marcar como lido</button>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por número do dia, data ou livro (ex: 214, 02/08, Jr)">
    </div>
    <button class="btn" id="btnMarkUpToToday">Marcar até hoje como lido</button>
    <button class="btn" id="btnReset">Limpar progresso</button>
  </div>

  <div class="months" id="months"></div>

  <footer>
    <span>Toque em um dia para ver a leitura. O círculo marca como lido.</span>
    <span id="todayLabel"></span>
  </footer>
</div>

 "2026-12-28", "dd": 28, "mm": 12, "month": "Dezembro", "reading": "Hb 10–13 • Jd 1 • Ap 4–8"}, {"day": 363, "date": "2026-12-29", "dd": 29, "mm": 12, "month": "Dezembro", "reading": "1Jo 1–5 • 2Jo • 3Jo • Ap 9–14"}, {"day": 364, "date": "2026-12-30", "dd": 30, "mm": 12, "month": "Dezembro", "reading": "Ap 15–21"}, {"day": 365, "date": "2026-12-31", "dd": 31, "mm": 12, "month": "Dezembro", "reading": "Ap 22 • Jo 3 • Mt 28"}];

const MONTHS_ORDER = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

let completed = new Set();
let selectedDay = null;
let todayEntry = null;

function pad(n){ return String(n).padStart(2,'0'); }

function findToday(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const iso = `${y}-${pad(m)}-${pad(d)}`;
  let entry = PLAN.find(p => p.date === iso);
  if(!entry){
    // fallback: clamp to closest day within the 2026 plan
    const target = new Date(iso);
    let best = PLAN[0], bestDiff = Infinity;
    for(const p of PLAN){
      const diff = Math.abs(new Date(p.date) - target);
      if(diff < bestDiff){ bestDiff = diff; best = p; }
    }
    entry = best;
  }
  return entry;
}

async function loadCompleted(){
  try{
    const res = await window.storage.get('completed-days', false);
    if(res && res.value){
      const arr = JSON.parse(res.value);
      completed = new Set(arr);
    }
  }catch(e){ /* nothing stored yet */ }
}

async function saveCompleted(){
  try{
    await window.storage.set('completed-days', JSON.stringify(Array.from(completed)), false);
  }catch(e){ console.error('Falha ao salvar progresso', e); }
}

function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}`;
}

function render(){
  renderProgress();
  renderMonths();
  renderReadingPanel();
}

function renderProgress(){
  const pct = Math.round((completed.size/365)*100);
  document.getElementById('progressCount').innerHTML = `${completed.size}<span> / 365 lidos</span>`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

function renderReadingPanel(){
  const entry = selectedDay ? PLAN.find(p=>p.day===selectedDay) : todayEntry;
  if(!entry) return;
  document.getElementById('rpDay').textContent = `Dia ${entry.day}`;
  document.getElementById('rpDate').textContent = fmtDate(entry.date) + (entry.day===todayEntry.day ? ' · hoje' : '');
  document.getElementById('rpReading').textContent = entry.reading;
  const btn = document.getElementById('btnMark');
  const isDone = completed.has(entry.day);
  btn.classList.toggle('is-done', isDone);
  btn.textContent = isDone ? 'Lido ✓' : 'Marcar como lido';
}

function toggleDone(day){
  if(completed.has(day)) completed.delete(day);
  else completed.add(day);
  saveCompleted();
  render();
}

function renderMonths(query){
  const container = document.getElementById('months');
  container.innerHTML = '';
  const q = (query||'').trim().toLowerCase();

  let anyResults = false;

  MONTHS_ORDER.forEach(monthName => {
    const monthDays = PLAN.filter(p => p.month === monthName);
    const filtered = q ? monthDays.filter(p => {
      return String(p.day).includes(q) ||
             fmtDate(p.date).includes(q) ||
             p.reading.toLowerCase().includes(q);
    }) : monthDays;

    if(q && filtered.length === 0) return;
    anyResults = true;

    const doneInMonth = monthDays.filter(p => completed.has(p.day)).length;
    const monthPct = Math.round((doneInMonth/monthDays.length)*100);

    const details = document.createElement('details');
    details.className = 'month';
    const hasToday = monthDays.some(p => p.day === todayEntry.day);
    if(hasToday || q) details.open = true;

    const summary = document.createElement('summary');
    summary.innerHTML = `
      <span>${monthName}</span>
      <span class="summary-right">
        <span class="month-mini-track"><span class="month-mini-fill" style="width:${monthPct}%"></span></span>
        <span class="chev">▸</span>
      </span>`;
    details.appendChild(summary);

    const grid = document.createElement('div');
    grid.className = 'day-grid';

    filtered.forEach(p => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'day-tile';
      if(p.day === todayEntry.day) tile.classList.add('is-today');
      if(p.day === selectedDay) tile.classList.add('is-active');
      if(completed.has(p.day)) tile.classList.add('is-done');
      tile.setAttribute('data-day', p.day);

      tile.innerHTML = `
        <div class="tile-top">
          <span class="tile-day">DIA ${p.day}</span>
          <span class="tile-check" data-check="${p.day}">
            <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.8 9L10 3" stroke="#0f1a12" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <div class="tile-reading">${p.reading}</div>
        <div class="tile-date">${fmtDate(p.date)}</div>
      `;

      tile.addEventListener('click', (e) => {
        if(e.target.closest('[data-check]')){
          e.stopPropagation();
          toggleDone(p.day);
          return;
        }
        selectedDay = p.day;
        renderReadingPanel();
        document.querySelectorAll('.day-tile').forEach(t => t.classList.remove('is-active'));
        tile.classList.add('is-active');
        document.getElementById('readingPanel').scrollIntoView({behavior:'smooth', block:'start'});
      });

      grid.appendChild(tile);
    });

    details.appendChild(grid);
    container.appendChild(details);
  });

  if(!anyResults){
    container.innerHTML = '<div class="no-results">Nenhum dia encontrado para essa busca.</div>';
  }
}

document.getElementById('btnMark').addEventListener('click', () => {
  const entry = selectedDay ? PLAN.find(p=>p.day===selectedDay) : todayEntry;
  toggleDone(entry.day);
});

document.getElementById('btnHoje').addEventListener('click', () => {
  selectedDay = todayEntry.day;
  render();
  document.getElementById('readingPanel').scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('btnMarkUpToToday').addEventListener('click', () => {
  for(let d=1; d<=todayEntry.day; d++) completed.add(d);
  saveCompleted();
  render();
});

document.getElementById('btnReset').addEventListener('click', () => {
  if(confirm('Limpar todo o progresso marcado?')){
    completed.clear();
    saveCompleted();
    render();
  }
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  renderMonths(e.target.value);
});

(async function init(){
  todayEntry = findToday();
  selectedDay = todayEntry.day;
  document.getElementById('todayLabel').textContent = `Hoje: Dia ${todayEntry.day} de 365`;
  await loadCompleted();
  render();
})();
</script>
